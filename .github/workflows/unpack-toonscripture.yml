name: Unpack ToonScripture OS migration

on:
  push:
    branches: [main]
    paths:
      - 'migration/bundle.part*'

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild migration archive
        run: |
          cat migration/bundle.part* | base64 --decode > /tmp/toonscripture.tar.gz

      - name: Extract ToonScripture OS
        run: |
          tar -xzf /tmp/toonscripture.tar.gz -C .
          rm -rf migration

      - name: Commit migrated application
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Migrate ToonScripture OS into Toons"
            git push
          fi
